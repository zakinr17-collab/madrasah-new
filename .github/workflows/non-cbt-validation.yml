name: Non-CBT Validation

on:
  push:
    branches:
      - fix/dual-mode-hardening

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Security audit
        continue-on-error: true
        run: npm run security:audit
      - name: Hardening regression
        continue-on-error: true
        run: npm run hardening:regression
      - name: Runtime regression
        continue-on-error: true
        run: npm run runtime:regression
      - name: Frontend audit
        run: npm run frontend:handler-audit
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: |
          rm -rf dist
          npm run build
          test -f dist/server.cjs
          git diff --check
      - name: Learning parity
        run: cmp -s src/learningModule.js public/learningModule.js
      - name: Admin parity
        run: |
          cmp -s src/adminModules.js public/adminModules.js
          cmp -s src/credentialVisibilityPatch.js public/credentialVisibilityPatch.js
      - name: Font audit
        run: npm run font:asset-audit
