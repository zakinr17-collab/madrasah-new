name: Refresh Hardening Lockfile

on:
  push:
    branches:
      - fix/dual-mode-hardening

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/dual-mode-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Refresh package lock from security overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify high and critical vulnerabilities are cleared
        run: npm audit --audit-level=high

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh security lockfile"
          git push origin HEAD:fix/dual-mode-hardening
