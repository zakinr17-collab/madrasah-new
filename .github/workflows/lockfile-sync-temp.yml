name: Temporary Lockfile Sync

on:
  push:
    branches: [fix/dual-mode-hardening]

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dual-mode-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm

      - name: Regenerate package lock with CI npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        run: npm ci

      - name: Verify high/critical audit
        run: npm audit --audit-level=high

      - name: Commit synchronized lock and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lockfile-sync-temp.yml
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "chore: sync dependency lockfile"
          git push origin HEAD:fix/dual-mode-hardening
