name: Non-CBT Final Validation

on:
  push:
    branches: [fix/dual-mode-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Block high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Application security audit excluding only known CBT livecam checks
        shell: bash
        run: |
          set +e
          npm run security:audit 2>&1 | tee security-audit.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          grep '^FAIL:' security-audit.log > security-fails.txt || true
          fail_count="$(wc -l < security-fails.txt | tr -d ' ')"
          cat security-fails.txt
          test "$fail_count" = "2"
          grep -Fxq 'FAIL: Teacher livecam signaling is assignment scoped' security-fails.txt
          grep -Fxq 'FAIL: Disabled LiveKit endpoint cannot bypass teacher signaling scope' security-fails.txt
      - name: Hardening regression excluding only known CBT/livecam checks
        shell: bash
        run: |
          set +e
          npm run hardening:regression 2>&1 | tee hardening.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          grep '^not ok ' hardening.log > hardening-fails.txt || true
          fail_count="$(wc -l < hardening-fails.txt | tr -d ' ')"
          cat hardening-fails.txt
          test "$fail_count" = "2"
          grep -Eq '^not ok [0-9]+ - Livecam: browser runtime is P2P-only, video-only, bounded and spotlight-safe
        run: npm run frontend:handler-audit
      - name: Runtime regression excluding only known CBT/livecam checks
        shell: bash
        run: |
          set +e
          npm run runtime:regression 2>&1 | tee runtime.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          grep '^not ok ' runtime.log > runtime-fails.txt || true
          fail_count="$(wc -l < runtime-fails.txt | tr -d ' ')"
          cat runtime-fails.txt
          test "$fail_count" = "2"
          grep -Eq '^not ok [0-9]+ - Livecam: browser runtime is P2P-only, video-only, bounded and spotlight-safe
        run: npm run lint
      - name: Build
        shell: bash
        run: |
          rm -rf dist
          npm run build
          test -f dist/server.cjs
          git diff --check
      - name: Font audit
        run: npm run font:asset-audit
      - name: Source/build parity
        shell: bash
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Build changed tracked source files."
            git status --short --untracked-files=no
            exit 1
          fi
 hardening-fails.txt
          grep -Eq '^not ok [0-9]+ - Assessment: teachers cannot mutate EVENT containers but can still read them
        run: npm run frontend:handler-audit
      - name: Runtime regression
        run: npm run runtime:regression
      - name: TypeScript
        run: npm run lint
      - name: Build
        shell: bash
        run: |
