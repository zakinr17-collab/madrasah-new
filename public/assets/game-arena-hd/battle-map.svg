<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2a1a4e"/><stop offset=".45" stop-color="#5b3a86"/><stop offset=".8" stop-color="#c56a9a"/><stop offset="1" stop-color="#f0a37c"/>
 </linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#7a4ea8"/><stop offset=".4" stop-color="#4a6ec0"/><stop offset="1" stop-color="#2c4a90"/>
 </linearGradient>
 <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f0d8a8"/><stop offset="1" stop-color="#d4b878"/>
 </linearGradient>
 <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#5aa653"/><stop offset="1" stop-color="#3d7a3d"/>
 </linearGradient>
 <radialGradient id="storm" cx=".5" cy=".5" r=".5">
  <stop offset=".7" stop-color="#8a3ad6" stop-opacity="0"/><stop offset="1" stop-color="#8a3ad6" stop-opacity=".55"/>
 </radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
 <radialGradient id="vign" cx=".5" cy=".5" r=".75">
  <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#1a0a30" stop-opacity=".45"/>
 </radialGradient>
</defs>

<rect width="1600" height="900" fill="url(#sky)"/>
<!-- dua bulan/planet -->
<circle cx="1200" cy="140" r="60" fill="#f5e9c8" opacity=".9"/>
<circle cx="1200" cy="140" r="90" fill="#f5e9c8" opacity=".2" filter="url(#soft)"/>
<g opacity=".85"><circle cx="320" cy="110" r="22" fill="#c8b0f0"/><circle cx="312" cy="104" r="5" fill="#a88ad0"/><circle cx="328" cy="116" r="3.5" fill="#a88ad0"/><circle cx="326" cy="102" r="2.5" fill="#a88ad0"/></g>
<!-- bintang -->
<g fill="#fff">
 <circle cx="150" cy="60" r="2.2" opacity=".8"/><circle cx="480" cy="80" r="1.8" opacity=".6"/>
 <circle cx="720" cy="50" r="2" opacity=".7"/><circle cx="950" cy="90" r="1.6" opacity=".5"/>
 <circle cx="1440" cy="70" r="2.2" opacity=".8"/><circle cx="880" cy="140" r="1.5" opacity=".4"/>
</g>

<!-- laut -->
<rect y="300" width="1600" height="600" fill="url(#sea)"/>
<rect y="292" width="1600" height="26" fill="#c8a8d8" opacity=".3" filter="url(#soft)"/>
<g stroke="#b8a0e8" stroke-width="3" opacity=".4" fill="none">
 <path d="M80 340q40 -10 80 0t80 0"/><path d="M1240 350q40 -10 80 0t80 0"/>
 <path d="M200 320q30 -8 60 0t60 0"/><path d="M1120 325q30 -8 60 0t60 0"/>
</g>
<!-- kilau bulan di air -->
<ellipse cx="1200" cy="360" rx="140" ry="12" fill="#f5e9c8" opacity=".25" filter="url(#soft)"/>

<!-- pulau -->
<path d="M180 640 Q400 560 800 575 Q1200 560 1420 640 Q1200 720 800 725 Q400 720 180 640 Z" fill="url(#sand)"/>
<path d="M260 630 Q460 565 800 578 Q1140 565 1340 630 Q1140 700 800 705 Q460 700 260 630 Z" fill="url(#grass)"/>
<!-- batu karang -->
<g fill="#6a5a50">
 <g><ellipse cx="230" cy="620" rx="46" ry="30"/><ellipse cx="218" cy="612" rx="26" ry="16" fill="#8a7a6e" opacity=".7"/><ellipse cx="1390" cy="618" rx="52" ry="32"/><ellipse cx="1376" cy="608" rx="30" ry="17" fill="#8a7a6e" opacity=".7"/></g>
</g>
<!-- pohon palem -->
<g>
 <path d="M420 600q-8 -80 20 -130" stroke="#7a5230" stroke-width="14" fill="none" stroke-linecap="round"/>
 <g fill="#3d9a4d">
  <ellipse cx="440" cy="450" rx="52" ry="18" transform="rotate(-18 440 450)"/>
  <ellipse cx="380" cy="452" rx="52" ry="18" transform="rotate(18 380 452)"/>
  <ellipse cx="412" cy="428" rx="50" ry="16" transform="rotate(-60 412 428)"/>
  <ellipse cx="410" cy="478" rx="50" ry="16" transform="rotate(60 410 478)"/>
 </g>
 <path d="M1180 598q8 -80 -20 -130" stroke="#7a5230" stroke-width="14" fill="none" stroke-linecap="round"/>
 <g fill="#3d9a4d">
  <ellipse cx="1160" cy="448" rx="52" ry="18" transform="rotate(18 1160 448)"/>
  <ellipse cx="1220" cy="450" rx="52" ry="18" transform="rotate(-18 1220 450)"/>
  <ellipse cx="1188" cy="426" rx="50" ry="16" transform="rotate(60 1188 426)"/>
  <ellipse cx="1190" cy="476" rx="50" ry="16" transform="rotate(-60 1190 476)"/>
 </g>
</g>
<!-- menara pengawas kayu -->
<g>
 <rect x="770" y="440" width="14" height="120" fill="#6a4a30"/>
 <rect x="816" y="440" width="14" height="120" fill="#6a4a30"/>
 <rect x="742" y="424" width="116" height="22" rx="6" fill="#8a6244" stroke="#5a3a24" stroke-width="3"/>
 <path d="M742 424l58 -40 58 40" fill="none" stroke="#5a3a24" stroke-width="6"/>
 <rect x="748" y="446" width="104" height="5" fill="#5a3a24" opacity=".5"/>
 <circle cx="800" cy="418" r="9" fill="#ffcf6a" opacity=".95"/>
 <circle cx="800" cy="418" r="18" fill="#ffcf6a" opacity=".25" filter="url(#soft)"/>
 <g stroke="#5a3a24" stroke-width="3.5"><path d="M788 560h24M788 540h24M788 520h24"/></g>
</g>
<!-- peti harta -->
<g>
 <rect x="600" y="600" width="70" height="46" rx="6" fill="#a3722f" stroke="#6d4a1e" stroke-width="3"/>
 <path d="M600 616h70" stroke="#6d4a1e" stroke-width="3"/>
 <rect x="626" y="608" width="18" height="30" rx="4" fill="#e8c34d" stroke="#a3822a" stroke-width="2"/>
</g>
<!-- barikade sandbag -->
<g fill="#c9b890" stroke="#9a8a68" stroke-width="2.5">
 <ellipse cx="1000" cy="630" rx="34" ry="16"/><ellipse cx="1042" cy="638" rx="34" ry="16"/>
 <ellipse cx="1020" cy="612" rx="34" ry="16"/><ellipse cx="1062" cy="620" rx="34" ry="16"/><ellipse cx="1034" cy="626" rx="34" ry="16" fill="#b8a678"/>
</g>
<!-- gap zona tengah (play area) -->
<circle cx="800" cy="640" r="330" fill="none" stroke="#b84fd6" stroke-width="6" opacity=".8" stroke-dasharray="18 12"/>
<rect width="1600" height="900" fill="url(#storm)" opacity=".6"/>

<rect width="1600" height="900" fill="url(#vign)"/>
</svg>