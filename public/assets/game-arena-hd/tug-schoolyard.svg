<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffd9a0"/><stop offset=".4" stop-color="#ffb37a"/>
  <stop offset=".75" stop-color="#e78a6b"/><stop offset="1" stop-color="#b96a63"/>
 </linearGradient>
 <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#d9b26e"/><stop offset=".25" stop-color="#c99f5f"/>
  <stop offset="1" stop-color="#9d7743"/>
 </linearGradient>
 <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff4dd"/><stop offset="1" stop-color="#e8cfa0"/>
 </linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="soft8"><feGaussianBlur stdDeviation="6"/></filter>
 <radialGradient id="vign" cx=".5" cy=".5" r=".75">
  <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#3a1c10" stop-opacity=".4"/>
 </radialGradient>
</defs>

