<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#1c2340"/><stop offset=".5" stop-color="#3a4a7a"/><stop offset="1" stop-color="#c98a6a"/>
 </linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#6a6250"/><stop offset=".3" stop-color="#5a5244"/><stop offset="1" stop-color="#3a352c"/>
 </linearGradient>
 <linearGradient id="wallB" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#3a5a9a"/><stop offset="1" stop-color="#22355e"/>
 </linearGradient>
 <linearGradient id="wallR" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#9a3a44"/><stop offset="1" stop-color="#5e2230"/>
 </linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="soft8"><feGaussianBlur stdDeviation="6"/></filter>
 <radialGradient id="vign" cx=".5" cy=".5" r=".75">
  <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#141018" stop-opacity=".5"/>
 </radialGradient>
</defs>

<rect width="1600" height="900" fill="url(#sky)"/>
<!-- matahari terbit -->
<circle cx="800" cy="330" r="60" fill="#ffd9a0" opacity=".9"/>
<circle cx="800" cy="330" r="110" fill="#ffcf90" opacity=".25" filter="url(#soft)"/>
<!-- awan gelap -->
<g fill="#2a3355" opacity=".7">
 <ellipse cx="250" cy="130" rx="150" ry="24"/><ellipse cx="1350" cy="110" rx="160" ry="26"/>
 <ellipse cx="900" cy="170" rx="100" ry="16"/>
</g>
<!-- pegunungan jauh -->
<path d="M0 400 L200 300 L400 390 L620 290 L800 380 L1000 280 L1200 390 L1400 300 L1600 390 V460 H0 Z" fill="#262e4e" opacity=".85"/>

<!-- medan -->
<rect y="440" width="1600" height="460" fill="url(#ground)"/>
<!-- kawah & retakan -->
<g fill="#2e2a22" opacity=".6">
 <ellipse cx="420" cy="700" rx="70" ry="18"/><ellipse cx="1150" cy="740" rx="80" ry="20"/>
 <ellipse cx="800" cy="800" rx="55" ry="14"/>
</g>
<!-- pasak/tembok pertahanan tengah -->
<g fill="#4a4438" stroke="#332e26" stroke-width="3">
 <path d="M760 560h80l-10 90h-60Z"/><path d="M690 640h60l-8 70h-44Z"/><path d="M850 640h60l8 70h-44Z"/>
</g>

<!-- BASE TIM BIRU (kiri): tembok + menara + bendera -->
<g>
 <path d="M40 460h340l24 44v190H40Z" fill="url(#wallB)" stroke="#16224a" stroke-width="4"/>
 <g fill="#1a2c5e">
  <rect x="70" y="440" width="34" height="24" rx="4"/><rect x="130" y="440" width="34" height="24" rx="4"/>
  <rect x="190" y="440" width="34" height="24" rx="4"/><rect x="250" y="440" width="34" height="24" rx="4"/>
  <rect x="310" y="440" width="34" height="24" rx="4"/>
 </g>
 <!-- gerbang bercahaya -->
 <path d="M150 694v-90a55 55 0 0 1 110 0v90Z" fill="#0c1a3a" stroke="#54e2ff" stroke-width="5"/>
 <path d="M150 694v-90a55 55 0 0 1 110 0v90Z" fill="none" stroke="#9fdfff" stroke-width="1.5" opacity=".5"/>
 <!-- menara samping -->
 <rect x="344" y="380" width="60" height="314" fill="url(#wallB)" stroke="#16224a" stroke-width="4"/>
 <path d="M338 380h72l-36 -34Z" fill="#1a2c5e"/>
 <circle cx="374" cy="330" r="8" fill="#54e2ff"/>
 <path d="M374 346v-14" stroke="#54e2ff" stroke-width="4"/>
 <!-- bendera biru -->
 <path d="M120 380v-90" stroke="#c8c8d0" stroke-width="5"/>
 <path d="M122 292h84l-16 22 16 22h-84Z" fill="#2f6fd0" stroke="#1a3a7a" stroke-width="2.5"/>
 <!-- jendela slit -->
 <g fill="#54e2ff" opacity=".85">
  <rect x="86" y="560" width="20" height="40" rx="4"/><rect x="300" y="560" width="20" height="40" rx="4"/>
 </g>
</g>

<!-- BASE TIM MERAH (kanan) -->
<g>
 <path d="M1560 460h-340l-24 44v190h364Z" fill="url(#wallR)" stroke="#3a1420" stroke-width="4"/>
 <g fill="#4a1420">
  <rect x="1496" y="440" width="34" height="24" rx="4"/><rect x="1436" y="440" width="34" height="24" rx="4"/>
  <rect x="1376" y="440" width="34" height="24" rx="4"/><rect x="1316" y="440" width="34" height="24" rx="4"/>
  <rect x="1256" y="440" width="34" height="24" rx="4"/>
 </g>
 <path d="M1340 694v-90a55 55 0 0 1 110 0v90Z" fill="#2a0a12" stroke="#ff6fa5" stroke-width="5"/>
 <path d="M1340 694v-90a55 55 0 0 1 110 0v90Z" fill="none" stroke="#ffc2d9" stroke-width="1.5" opacity=".5"/>
 <rect x="1196" y="380" width="60" height="314" fill="url(#wallR)" stroke="#3a1420" stroke-width="4"/>
 <path d="M1190 380h72l-36 -34Z" fill="#4a1420"/>
 <circle cx="1226" cy="330" r="8" fill="#ff6fa5"/>
 <path d="M1226 346v-14" stroke="#ff6fa5" stroke-width="4"/>
 <path d="M1480 380v-90" stroke="#c8c8d0" stroke-width="5"/>
 <path d="M1394 292h84l16 22-16 22h-84Z" fill="#d04a5a" stroke="#7a1a2a" stroke-width="2.5"/>
 <g fill="#ff6fa5" opacity=".85">
  <rect x="1494" y="560" width="20" height="40" rx="4"/><rect x="1280" y="560" width="20" height="40" rx="4"/>
 </g>
</g>

<!-- bayangan benteng di tanah -->
<ellipse cx="230" cy="700" rx="230" ry="26" fill="#14100a" opacity=".35" filter="url(#soft8)"/>
<ellipse cx="1370" cy="700" rx="230" ry="26" fill="#14100a" opacity=".35" filter="url(#soft8)"/>

<!-- garis tengah marka -->
<g stroke="#e8e2d0" stroke-width="6" stroke-dasharray="30 26" opacity=".7">
 <path d="M800 500v340"/>
</g>
<!-- karung pasir garis depan -->
<g fill="#c9b890" stroke="#9a8a68" stroke-width="2.5">
 <ellipse cx="600" cy="740" rx="40" ry="18"/><ellipse cx="648" cy="750" rx="40" ry="18"/>
 <ellipse cx="624" cy="722" rx="40" ry="18"/>
 <ellipse cx="960" cy="740" rx="40" ry="18"/><ellipse cx="1008" cy="750" rx="40" ry="18"/>
 <ellipse cx="984" cy="722" rx="40" ry="18"/>
</g>
<!-- supply crate drop tengah -->
<g transform="translate(560 620)">
 <path d="M-40 -70h80v40h-80Z" fill="#b3554a" opacity=".9"/>
 <path d="M-14 -70v-22h28v22" fill="none" stroke="#d8cfc0" stroke-width="4"/>
 <rect x="-46" y="0" width="92" height="60" rx="8" fill="#8a6b3a" stroke="#5d4326" stroke-width="4"/>
 <path d="M-46 22h92" stroke="#5d4326" stroke-width="4"/>
 <rect x="-12" y="8" width="24" height="28" rx="4" fill="#e8c34d" stroke="#a3822a" stroke-width="2.5"/>
</g>
<!-- spanduk VS tengah -->
<g transform="translate(800 480)">
 <rect x="-90" y="-24" width="180" height="48" rx="10" fill="#1c2433" stroke="#c8cdd4" stroke-width="3"/>
 <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#e8e2d0">VS</text>
 <path d="M-90 0h-60M90 0h60" stroke="#c8cdd4" stroke-width="3" stroke-dasharray="8 8"/>
</g>
<!-- krunya -->
<g fill="#3a352c"><ellipse cx="430" cy="730" rx="56" ry="16"/><ellipse cx="1150" cy="760" rx="62" ry="18"/></g>

<rect width="1600" height="900" fill="url(#vign)"/>
</svg>